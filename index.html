<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zauberspiegel-Tiere</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8fd3ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }

  /* ---------- Bühne ---------- */
  #stage {
    position: fixed; inset: 0; overflow: hidden;
    background: linear-gradient(#8fd3ff 0%, #d4f0ff 62%, #86cf72 62%, #5fae52 100%);
  }
  .sun {
    position: absolute; top: 7%; right: 9%; width: 18vmin; height: 18vmin; border-radius: 50%;
    background: #ffd84d; box-shadow: 0 0 50px #ffe680; cursor: pointer;
    transition: transform .6s ease, box-shadow .6s ease, background .6s ease;
  }
  .sun::before { content: ""; position: absolute; inset: -4vmin; border-radius: 50%; } /* größere Tippfläche */
  /* Sonnenstrahlen: erscheinen beim Antippen und drehen sich */
  .sun .rays {
    position: absolute; inset: -60%; border-radius: 50%; pointer-events: none; opacity: 0;
    background: repeating-conic-gradient(from 0deg, rgba(255, 210, 60, .95) 0deg 9deg, transparent 9deg 30deg);
    -webkit-mask: radial-gradient(circle, transparent 36%, #000 38%, #000 68%, transparent 70%);
            mask: radial-gradient(circle, transparent 36%, #000 38%, #000 68%, transparent 70%);
    transition: opacity .5s ease;
  }
  .sun.shine { transform: scale(1.25); background: #ffe14d; }
  /* Leuchten als weicher Lichtkranz um die Sonne */
  .sun::after {
    content: ""; position: absolute; inset: -110%; border-radius: 50%; pointer-events: none; opacity: 0;
    background: radial-gradient(circle closest-side, rgba(255, 236, 140, 0) 30%, rgba(255, 236, 140, .8) 32%, rgba(255, 245, 190, .35) 60%, rgba(255, 245, 190, 0) 100%);
    transition: opacity .6s ease;
  }
  .sun.shine::after { opacity: 1; }
  .sun.shine .rays { opacity: 1; animation: spin 6s linear infinite, raypulse 1s ease-in-out infinite alternate; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes raypulse { from { scale: .92; } to { scale: 1.08; } }
  #stage.sunny { background: linear-gradient(#a6dcff 0%, #e6f6ff 62%, #93d97e 62%, #6bb85c 100%); }
  #stage { transition: background .8s ease; }
  #stage::before { content: ""; position: absolute; inset: 0; background: url("hintergrund.svg") center bottom / cover no-repeat; pointer-events: none; }

  .cloud {
    position: absolute; height: 8vmin; width: 26vmin; border-radius: 8vmin; background: #fff; opacity: .9;
    cursor: pointer; transition: background .5s ease;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: #fff; border-radius: 50%; transition: background .5s ease;
  }
  .cloud::before { width: 11vmin; height: 11vmin; left: 4vmin; top: -5vmin; }
  .cloud::after { width: 9vmin; height: 9vmin; left: 13vmin; top: -3.5vmin; }
  .c1 { top: 12%; left: 8%; } .c2 { top: 26%; left: 55%; scale: .7; }
  /* Regenwolke: wird grau und wackelt kurz */
  .cloud.rain, .cloud.rain::before, .cloud.rain::after { background: #aab6c4; }
  .cloud.rain { animation: cloudwobble .5s ease-in-out 1; }
  @keyframes cloudwobble { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .drop {
    position: absolute; width: 4px; height: 16px; border-radius: 2px; pointer-events: none;
    background: linear-gradient(rgba(90, 169, 230, 0), #4a9be0);
  }
  /* Matschwolke: wird braun, Matschtropfen sind dicker und rund */
  .cloud.muddy, .cloud.muddy::before, .cloud.muddy::after { background: #9a7b5c; }
  .cloud.muddy { animation: cloudwobble .5s ease-in-out 1; }
  .drop.mud { width: 11px; height: 13px; border-radius: 50% 50% 45% 45%; background: #7a5230; }
  .sparkle { position: absolute; font-size: 30px; pointer-events: none; z-index: 3; }
  .sponge { position: absolute; font-size: 46px; pointer-events: none; z-index: 3; filter: drop-shadow(0 3px 3px rgba(0,0,0,.25)); }

  /* ---------- Tier ---------- */
  #animal {
    position: absolute; left: -35%; bottom: 12%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
  }
  #body {
    width: min(80vw, 54vh); cursor: pointer;
    transform-origin: 50% 100%;
    touch-action: none; /* Reiben mit dem Finger, ohne dass die Seite scrollt */
  }
  #body svg { display: block; width: 100%; height: auto; overflow: visible; }
  .bubble {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    margin-bottom: 14px; padding: .25em .7em; border-radius: 1em;
    background: #fff; color: #222; font-size: min(9vw, 6vh); font-weight: 800; white-space: nowrap;
    box-shadow: 0 4px 10px rgba(0,0,0,.15);
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .bubble.show { opacity: 1; }
  .bubble::after {
    content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 12px solid transparent; border-top-color: #fff;
  }

  /* Bewegungen */
  #animal.walking #body { animation: hop .45s ease-in-out infinite; }
  #animal.waiting #body { animation: breathe 2.4s ease-in-out infinite; }
  #animal.happy   #body { animation: jump .5s ease-out 3; }
  #animal.hint    #body { animation: jump .5s ease-out 2; }
  #animal.listen  #body { animation: tilt 1.2s ease-in-out 1; }
  #animal.no      #body { animation: shake .9s ease-in-out 1; }
  #animal.waveback #body { animation: sway 1s ease-in-out 2; }

  @keyframes sway { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }

  /* Bewegungen innerhalb der Zeichnung */
  #body .tail, #body .arm, #body .head, #body .eyes { transform-box: fill-box; }
  #body .tail.wag  { transform-origin: 0% 100%; animation: wag .35s ease-in-out infinite alternate; }
  #body .tail.slow { transform-origin: 0% 100%; animation: tailsway 1.6s ease-in-out infinite alternate; }
  #body .eyes { transform-origin: 50% 50%; animation: blink 4s infinite; }
  #body .mo, #body .arm { opacity: 0; }
  #animal.happy .head { transform-origin: 50% 100%; animation: yap .3s ease-out 4; }
  #animal.happy .mo { opacity: 1; }
  #animal.happy .mc { opacity: 0; }
  #animal.waveback .arm { opacity: 1; transform-origin: 50% 100%; animation: pawwave .4s ease-in-out infinite alternate; }
  #animal.waveback .fp { opacity: 0; }
  @keyframes wag      { from { transform: rotate(-18deg); } to { transform: rotate(22deg); } }
  @keyframes tailsway { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
  @keyframes blink    { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes yap      { 50% { transform: translateY(-8px) rotate(-3deg); } }
  @keyframes pawwave  { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }

  /* kleiner Kamera-Spiegel oben links (zum Testen) */
  #mirror {
    position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px;
    width: 26vmin; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden;
    border: 3px solid #fff; background: #000; opacity: .9; display: none; pointer-events: none;
    transform: scaleX(-1); /* Spiegelbild */
  }
  #mirror.on { display: block; }
  #mirror video, #mirror canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* Testanzeigen sind für das Kind unsichtbar. Das Kamerabild bleibt nur durchsichtig,
     damit das Handy die Kamera nicht anhält. Elternecke: lange oben links drücken. */
  body:not(.testmode) #mirror { opacity: 0; }
  body:not(.testmode) #debug { display: none; }
  #parent {
    position: fixed; top: 0; left: 0; width: 80px; height: 80px; z-index: 4;
    -webkit-tap-highlight-color: transparent;
  }
  #toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 6;
    background: rgba(0,0,0,.7); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 15px;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  @keyframes hop     { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-10%) rotate(4deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04, .97); } }
  @keyframes jump    { 0%,100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-25%) scale(1.08); } 70% { transform: translateY(0) scale(1.05, .92); } }
  @keyframes tilt    { 0%,100% { transform: rotate(0); } 30%,70% { transform: rotate(12deg); } }
  @keyframes shake   { 0%,100% { transform: rotate(0); } 15% { transform: rotate(-16deg); } 35% { transform: rotate(16deg); } 55% { transform: rotate(-14deg); } 75% { transform: rotate(12deg); } 90% { transform: rotate(-6deg); } }

  /* ---------- Testinfo unten ---------- */
  #debug {
    position: absolute; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom));
    font-size: 12px; line-height: 1.45; color: #173a12; opacity: .8; text-align: left;
    white-space: pre-line; pointer-events: none;
  }

  /* ---------- Startbildschirm ---------- */
  #start {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: rgba(255,255,255,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #start h1 { margin: 0; font-size: 8vmin; color: #1f3b73; text-align: center; }
  #startBtn {
    font-size: 7vmin; font-weight: 800; padding: .6em 1.4em; border: 0; border-radius: 1em;
    background: #ff8a3d; color: #fff; box-shadow: 0 6px 0 #c85f17;
  }
  #startBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c85f17; }
  #start a { color: #1f3b73; font-size: 15px; }
</style>
</head>

function levenshtein(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
  }
  return d[a.length][b.length];
}

function matchAnimal(texts, candidates = ANIMALS) {
  const split = (t) => t.toLowerCase().replace(/[^a-zäöüß\s]/g, ' ').split(/\s+/).filter(Boolean);
  for (const pass of ['strong', 'weak', 'fuzzy']) {
    for (const t of texts) {
      const words = split(t);
      if (pass !== 'strong' && words.length > 2) continue;
      for (const w of words) {
        for (const a of candidates) {
          if (pass === 'strong' && a.strong.includes(w)) return { animal: a, word: w };
          if (pass === 'weak' && a.weak.includes(w)) return { animal: a, word: w };
          if (pass === 'fuzzy' && w.length >= 3 && a.fuzzy.some((f) => levenshtein(w, f) <= 1)) return { animal: a, word: w };
        }
      }
    }
  }
  return null;
}

// Phasen: start → entering → waiting → reacting → leaving → entering …
const state = { phase: 'start', current: null, index: 0, lastActivity: 0 };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

function setMode(mode) {
  animalEl.className = '';
  void animalEl.offsetWidth; // Animation neu starten
  animalEl.className = mode;
}

function oneShot(mode, ms) {
  setMode(mode);
  setTimeout(() => {
    if (state.phase === 'waiting' && animalEl.className === mode) setMode('waiting');
  }, ms);
}

let bubbleTimer = 0;
function showBubble(text, ms) {
  bubbleEl.textContent = text;
  bubbleEl.classList.add('show');
  clearTimeout(bubbleTimer);
  if (ms) bubbleTimer = setTimeout(hideBubble, ms);
}
function hideBubble() { bubbleEl.classList.remove('show'); }

async function walk(from, to, ms) {
  setMode('walking');
  const anim = animalEl.animate([{ left: from + '%' }, { left: to + '%' }],
    { duration: ms, easing: 'ease-in-out', fill: 'forwards' });
  try { await anim.finished; } catch (e) {}
  animalEl.style.left = to + '%';
  anim.cancel();
}

// Zufällige Reihenfolge: jedes Tier kommt einmal pro Runde, nie zweimal direkt hintereinander
let animalBag = [];
function pickAnimal() {
  if (!animalBag.length) {
    animalBag = ANIMALS.slice();
    for (let i = animalBag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [animalBag[i], animalBag[j]] = [animalBag[j], animalBag[i]];
    }
    if (animalBag[animalBag.length - 1] === state.current) animalBag.unshift(animalBag.pop());
  }
  return animalBag.pop();
}

async function nextAnimal() {
  state.current = pickAnimal();
  state.index++;
  bodyEl.innerHTML = svgFor(state.current.svg);
  mudSpots = []; state.dirty = false;
  // größere Tiere (Elefant) entsprechend größer zeichnen
  bodyEl.style.width = state.current.size ? `calc(min(80vw, 54vh) * ${state.current.size})` : '';
  state.phase = 'entering';
  hideBubble();
  listener.resume();
  await walk(-35, 50, 2600);
  state.phase = 'waiting';
  state.lastActivity = Date.now();
  setMode('waiting');
}

// Volle Reaktion: Freudensprung + Geräusch, dann hinauslaufen
async function react(how) {
  if (state.phase !== 'waiting') return;
  state.phase = 'reacting';
  dbgLast = how; renderDebug();
  // Schmutziges Tier macht sein Geräusch, bleibt aber, bis es sauber ist
  if (state.dirty) {
    setMode('happy');
    showBubble(state.current.say);
    await Promise.all([playSound(state.current), wait(1600)]);
    hideBubble();
    setMode('waiting');
    state.phase = 'waiting';
    state.lastActivity = Date.now();
    return;
  }
  // Zuhören läuft weiter (jeder Neustart riskiert Fehler); Gehörtes wird außerhalb von 'waiting' ignoriert
  setMode('happy');
  showBubble(state.current.say);
  await Promise.all([playSound(state.current), wait(1600)]);
  hideBubble();
  await wait(300);
  state.phase = 'leaving';
  await walk(50, 135, 2600);
  nextAnimal();
}

// Ton gehört oder unbekanntes Wort: Tier horcht auf
function perkUp(how) {
  if (state.phase !== 'waiting') return;
  state.lastActivity = Date.now();
  dbgLast = how; renderDebug();
  oneShot('listen', 1200);
  showBubble('👂', 1200);
}

// Name des anderen Tiers: Tier schüttelt den Kopf
function wrongAnimal(how) {
  if (state.phase !== 'waiting') return;
  state.lastActivity = Date.now();
  dbgLast = how; renderDebug();
  oneShot('no', 1000);
  showBubble('❓', 1200);
}

// Kind winkt: Tier hebt die Pfote und winkt zurück (bleibt aber stehen)
let lastWaveAt = 0;
function waveBack(how = 'Winken') {
  if (state.phase !== 'waiting') return;
  if (Date.now() - lastWaveAt < 2500) return; // nicht doppelt auslösen (Hand + Bewegung + "Hallo")
  lastWaveAt = Date.now();
  state.lastActivity = Date.now();
  dbgLast = how; renderDebug();
  oneShot('waveback', 2000);
}

// Aufforderung, wenn 8 Sekunden nichts passiert
setInterval(() => {
  if (state.phase === 'waiting' && !state.dirty && Date.now() - state.lastActivity > 8000) {
    state.lastActivity = Date.now();
    oneShot('hint', 1000);
    showBubble(state.dirty ? '🧽' : '👋', 1500);
  }
}, 1000);

// Antippen (sauberes Tier) bzw. Sauberreiben (schmutziges Tier)
let rubbing = false, lastRub = null;
bodyEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (state.dirty) {
    if (state.phase !== 'waiting') return;
    rubbing = true; lastRub = null;
    try { bodyEl.setPointerCapture(e.pointerId); } catch (err) {}
    rub(e);
    return;
  }
  react('angetippt');
});
bodyEl.addEventListener('pointermove', (e) => { if (rubbing) rub(e); });
['pointerup', 'pointercancel'].forEach((ev) => bodyEl.addEventListener(ev, () => { rubbing = false; lastRub = null; }));

/* ======================= Geräusch ======================= */
let audioCtx = null;
let germanVoice = null;

function pickVoice() {
  const voices = speechSynthesis.getVoices();
  germanVoice = voices.find((v) => /^de/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

// Ersatz-Geräusch, falls keine Sprachausgabe vorhanden
function beep(animal) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const tone = (f1, f2, start, dur, type) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t + start);
    o.frequency.linearRampToValueAtTime(f2, t + start + dur);
    g.gain.setValueAtTime(0.0001, t + start);
    g.gain.exponentialRampToValueAtTime(0.4, t + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + start + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + start);
    o.stop(t + start + dur + 0.05);
  };
  if (animal.name === 'Hund') { tone(300, 180, 0, 0.15, 'sawtooth'); tone(300, 180, 0.25, 0.15, 'sawtooth'); }
  else { tone(600, 1000, 0, 0.25, 'sine'); tone(1000, 550, 0.25, 0.4, 'sine'); }
}

// Tiergeräusche: Dateien gleich beim Öffnen laden, nach dem Start-Tippen entschlüsseln
const soundRaw = {}, soundBuf = {};
for (const a of ANIMALS) {
  soundRaw[a.name] = fetch(a.sound)
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .catch(() => null);
}
async function decodeSounds() {
  for (const a of ANIMALS) {
    try {
      const data = await soundRaw[a.name];
      if (data && audioCtx) soundBuf[a.name] = await audioCtx.decodeAudioData(data.slice(0));
    } catch (e) { /* dann Ersatz über Sprachausgabe */ }
  }
}

// Tonausgabe nur während des Geräuschs offen halten, damit sie das Mikrofon nicht blockiert
function releaseAudio() {
  if (audioCtx && !volumeStarted && audioCtx.state === 'running') audioCtx.suspend().catch(() => {});
}

function playSound(animal) {
  const buf = soundBuf[animal.name];
  if (!buf || !audioCtx) return speakSound(animal);
  return new Promise(async (resolve) => {
    let finished = false;
    const done = () => { if (!finished) { finished = true; releaseAudio(); resolve(); } };
    try {
      await audioCtx.resume();
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.onended = done;
      src.start();
      setTimeout(done, buf.duration * 1000 + 500); // Sicherheitsnetz
    } catch (e) { speakSound(animal).then(done); }
  });
}

// Ersatz, falls die Datei fehlt: Sprachausgabe sagt "Wau wau!" bzw. "Miau!"
function speakSound(animal) {
  return new Promise((resolve) => {
    let finished = false;
    const done = () => { if (!finished) { finished = true; resolve(); } };
    const fallback = () => { beep(animal); setTimeout(done, 900); };
    if (!('speechSynthesis' in window)) { fallback(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(animal.say);
      u.lang = 'de-DE';
      if (germanVoice) u.voice = germanVoice;
      u.pitch = animal.pitch;
      u.rate = animal.rate;
      u.volume = 1;
      u.onend = done;
      u.onerror = fallback;
      speechSynthesis.speak(u);
      setTimeout(done, 3500); // Sicherheitsnetz
    } catch (e) { fallback(); }
  });
}

/* ======================= Zuhören ======================= */
function handleHeard(texts, isFinal) {
  const any = matchAnimal(texts);
  dbgHeard = `„${texts[0]}“` + (any ? ` → ${any.animal.emoji}` : '');
  renderDebug();
  if (state.phase !== 'waiting') return;
  const mine = matchAnimal(texts, [state.current]);
  if (mine) { react(`Wort „${mine.word}“`); return; }
  const hello = matchAnimal(texts, [GREETING]);
  if (hello) { waveBack(`Wort „${hello.word}“`); return; }
  if (!isFinal) return; // Zwischenergebnisse lösen nur bei einem Treffer etwas aus
  if (any) wrongAnimal(`anderes Tier „${any.word}“`);
  else perkUp(`unbekanntes Wort „${texts[0]}“`);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// Fehler werden immer wieder versucht. Nur eine Sperre ("not-allowed"), die sich 3-mal hintereinander
// wiederholt, oder eine fehlende Sprache beendet das Zuhören.
const BLOCKED = ['not-allowed', 'service-not-allowed'];
const MAX_BLOCKED = 3;
const RESTART_DELAY = 700;   // Pause vor jedem Neustart, damit Android die alte Erkennung freigeben kann
const MAX_RETRY_DELAY = 10000;

// Wenn möglich auf dem Handy erkennen (ohne Internet): Sprachpaket prüfen und ggf. installieren.
// Muss beim Tippen auf "Los geht's" aufgerufen werden.
function prepareLocalSpeech() {
  const S = window.SpeechRecognition;
  if (!S || typeof S.available !== 'function') { listener.mode = 'Internet'; return; }
  const opts = { langs: ['de-DE'], processLocally: true };
  S.available(opts).then((r) => {
    if (r === 'available') { listener.useLocal(); return; }
    if (r === 'downloadable' || r === 'downloading') {
      listener.mode = 'Internet, Sprachpaket lädt …';
      return S.install(opts).then((ok) => {
        if (ok) listener.useLocal(); else listener.mode = 'Internet';
      });
    }
    listener.mode = 'Internet';
  }).catch(() => { listener.mode = 'Internet'; });
}

const listener = {
  rec: null,          // aktuelle Spracherkennung (bei jedem Start neu angelegt)
  wanted: false,      // soll gerade zugehört werden?
  state: 'off',       // off | starting | running
  fatal: false,
  starts: 0, softErrors: 0, blockedCount: 0, lastErr: '–', startedAt: 0, retryAt: 0,
  pendingSound: false, soundTimer: 0,
  local: false, mode: 'Internet',   // local = Erkennung auf dem Handy

  // ab dem nächsten Start auf dem Handy erkennen
  useLocal() {
    this.local = true;
    this.mode = 'auf dem Handy';
    if (this.state !== 'off') this.drop(); // neu starten, damit es sofort greift
  },

  init() {
    if (!SR) {
      this.fatal = true;
      setSr('keine Spracherkennung im Browser');
      startVolume();
      return;
    }
    // Kontrolle: prüft jede Sekunde, ob zugehört wird, und startet sonst neu
    setInterval(() => this.watchdog(), 1000);
  },

  show(text) { setSr(`${text} · ${this.mode} · Start #${this.starts} · Fehler: ${this.lastErr}`); },

  create() {
    const rec = new SR();
    rec.lang = 'de-DE';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 3;
    if (this.local) rec.processLocally = true;
    const mine = () => rec === this.rec; // Ereignisse alter, verworfener Instanzen ignorieren

    rec.onstart = () => { if (!mine()) return; this.state = 'running'; this.show('hört zu ✅'); };
    rec.onend = () => {
      if (!mine()) return;
      this.rec = null;
      this.state = 'off';
      this.soundEnded();
      if (this.wanted) {
        this.retryAt = Math.max(this.retryAt, Date.now() + RESTART_DELAY);
        setTimeout(() => this.startNow(), this.retryAt - Date.now() + 10);
      }
    };
    rec.onsoundstart = () => { if (!mine()) return; this.softErrors = 0; this.soundStarted(); };
    rec.onspeechstart = () => { if (!mine()) return; this.softErrors = 0; this.soundStarted(); };
    rec.onsoundend = () => { if (mine()) this.soundEnded(); };
    rec.onspeechend = () => { if (mine()) this.soundEnded(); };
    rec.onnomatch = () => { if (!mine()) return; this.pendingSound = true; this.soundEnded(); };
    rec.onerror = (ev) => {
      if (!mine() || this.fatal) return;
      if (ev.error === 'no-speech' || ev.error === 'aborted') return; // normal, läuft weiter
      this.lastErr = ev.error;
      if (ev.error === 'language-not-supported') { this.fatal = true; this.show('Deutsch nicht verfügbar'); return; }
      // Erkennung auf dem Handy klappt nicht → zurück zur Erkennung übers Internet
      if (this.local && ev.error === 'service-not-allowed') {
        this.local = false;
        this.mode = 'Internet';
      } else if (BLOCKED.includes(ev.error)) {
        this.blockedCount++;
        if (this.blockedCount >= MAX_BLOCKED) { this.fatal = true; this.show('Mikrofon gesperrt'); return; }
      }
      // nie aufgeben: wachsende Pausen 1 s, 2 s, 4 s, 8 s, dann alle 10 s
      this.softErrors++;
      const wait = Math.min(MAX_RETRY_DELAY, 1000 * 2 ** (this.softErrors - 1));
      this.retryAt = Date.now() + wait;
      this.show(`Fehler, neuer Versuch in ${Math.round(wait / 1000)} s`);
    };
    rec.onresult = (ev) => {
      if (!mine()) return;
      this.softErrors = 0;
      this.blockedCount = 0;
      this.pendingSound = false;
      clearTimeout(this.soundTimer);
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        const texts = [];
        for (let j = 0; j < r.length; j++) {
          const t = (r[j] && r[j].transcript || '').trim();
          if (t && !texts.includes(t)) texts.push(t);
        }
        if (texts.length) handleHeard(texts, r.isFinal);
      }
    };
    return rec;
  },

  startNow() {
    if (!SR || this.fatal || !this.wanted || this.state !== 'off' || Date.now() < this.retryAt) return;
    this.rec = this.create();
    this.state = 'starting';
    this.startedAt = Date.now();
    this.starts++;
    this.show('startet …');
    try {
      this.rec.start();
    } catch (e) {
      this.lastErr = 'Start: ' + (e.name || e.message);
      this.rec = null;
      this.state = 'off';
      this.retryAt = Date.now() + 1000;
      this.show('Start fehlgeschlagen');
    }
  },

  watchdog() {
    if (this.fatal || !this.wanted) return;
    if (this.state === 'off') {
      this.startNow();
    } else if (this.state === 'starting' && Date.now() - this.startedAt > 4000) {
      this.lastErr = 'Start hängt';
      this.drop(); // nächster Versuch nach RESTART_DELAY über die Kontrolle
    }
  },

  // aktuelle Instanz verwerfen (ihre späteren Ereignisse werden ignoriert)
  drop() {
    const r = this.rec;
    this.rec = null;
    this.state = 'off';
    this.retryAt = Math.max(this.retryAt, Date.now() + RESTART_DELAY);
    if (r) { try { r.abort(); } catch (e) {} }
  },

  resume() { this.wanted = true; this.startNow(); },
  pause() {
    this.wanted = false;
    this.pendingSound = false;
    clearTimeout(this.soundTimer);
    this.drop();
    if (!this.fatal) this.show('pausiert');
  },

  // Etwas gehört, aber kein Wort verstanden → Tier horcht auf
  soundStarted() { this.pendingSound = true; clearTimeout(this.soundTimer); },
  soundEnded() {
    if (!this.pendingSound) return;
    clearTimeout(this.soundTimer);
    this.soundTimer = setTimeout(() => {
      if (this.pendingSound) { this.pendingSound = false; perkUp('Ton ohne Wort'); }
    }, 1200);
  }
};

// Ersatz, wenn die Spracherkennung nicht geht: lauter Ton löst die Reaktion aus
let volumeStarted = false, volumeTries = 0;
function startVolume() {
  if (volumeStarted) return;
  volumeStarted = true;
  volumeTries++;
  setVol('startet …');
  navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
    if (!audioCtx) { setVol('kein Audio'); return; }
    audioCtx.resume();
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    const data = new Float32Array(analyser.fftSize);
    let last = 0;
    setVol('Lautstärke aktiv ✅');
    const tick = () => {
      analyser.getFloatTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
      const rms = Math.sqrt(sum / data.length);
      if (rms > 0.06 && Date.now() - last > 1500 && state.phase === 'waiting') {
        last = Date.now();
        react('lauter Ton');
      }
      requestAnimationFrame(tick);
    };
    tick();
  }).catch((e) => {
    const names = { NotAllowedError: 'Mikrofon nicht erlaubt', NotReadableError: 'Mikrofon belegt', NotFoundError: 'kein Mikrofon' };
    const msg = names[e.name] || e.name || e.message;
    // belegtes Mikrofon: bis zu 3 Versuche
    if (e.name === 'NotReadableError' && volumeTries < 3) {
      setVol(msg + ' – neuer Versuch');
      volumeStarted = false;
      setTimeout(startVolume, 2000);
    } else {
      setVol(msg);
    }
  });
}

/* ======================= Kamera & Winken ======================= */
const MP_VERSION = '0.10.14';
const MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}`;
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task';
const HAND_THRESHOLD = 0.3; // niedriger als Standard (0.5): Hand wird früher erkannt

let recognizerPromise = null;
function loadRecognizer() {
  if (!recognizerPromise) {
    recognizerPromise = (async () => {
      const { FilesetResolver, GestureRecognizer } = await import(`${MP_BASE}/vision_bundle.mjs`);
      const fileset = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
      const options = (delegate) => ({
        baseOptions: { modelAssetPath: MODEL_URL, delegate },
        runningMode: 'VIDEO',
        numHands: 1,
        minHandDetectionConfidence: HAND_THRESHOLD,
        minHandPresenceConfidence: HAND_THRESHOLD,
        minTrackingConfidence: HAND_THRESHOLD
      });
      try { return await GestureRecognizer.createFromOptions(fileset, options('GPU')); }
      catch (e) { return await GestureRecognizer.createFromOptions(fileset, options('CPU')); }
    })();
    recognizerPromise.catch(() => { recognizerPromise = null; }); // beim nächsten Mal neu versuchen
  }
  return recognizerPromise;
}
// gleich beim Öffnen der Seite im Hintergrund laden
loadRecognizer().catch(() => {});

/* Winken erkennen: Ein Punkt (Fingerspitze oder Bewegungs-Schwerpunkt) muss sich mehrmals hin und her bewegen.
   Jede Richtungsumkehr zählt, wenn die Bewegung mindestens AMP (Anteil der Bildbreite) groß war.
   Winken = mindestens 2 Umkehrungen (also hin–her–hin) innerhalb von 2 Sekunden. */
function makeWaveDetector(AMP, NEEDED = 2) {
  return {
    AMP, NEEDED, WINDOW: 2000, COOLDOWN: 2500,
    dir: 0, ext: null, reversals: [], cooldownUntil: 0,
    reset() { this.dir = 0; this.ext = null; this.reversals = []; },
    add(x, t) {
      if (this.ext === null) { this.ext = x; return false; }
      if (this.dir === 0) {
        if (Math.abs(x - this.ext) > this.AMP) { this.dir = x > this.ext ? 1 : -1; this.ext = x; }
        return false;
      }
      if (this.dir === 1) {
        if (x > this.ext) this.ext = x;
        else if (this.ext - x > this.AMP) { this.dir = -1; this.ext = x; this.reversals.push(t); }
      } else {
        if (x < this.ext) this.ext = x;
        else if (x - this.ext > this.AMP) { this.dir = 1; this.ext = x; this.reversals.push(t); }
      }
      this.reversals = this.reversals.filter((r) => t - r <= this.WINDOW);
      if (this.reversals.length >= this.NEEDED && t >= this.cooldownUntil) {
        this.cooldownUntil = t + this.COOLDOWN;
        this.reversals = [];
        return true;
      }
      return false;
    }
  };
}
const wave = makeWaveDetector(0.035);       // erkannte Hand
const motionWave = makeWaveDetector(0.12, 3); // Ersatz: deutliche Hin-und-her-Bewegung im Bild, wenn keine Hand erkannt wird

/* Bewegung im Bild: kleines Graubild mit dem vorigen vergleichen,
   Schwerpunkt der veränderten Stellen liefert die Position der Bewegung */
const MW = 48, MH = 36;
const motionCanvas = document.createElement('canvas');
motionCanvas.width = MW; motionCanvas.height = MH;
const mctx = motionCanvas.getContext('2d', { willReadFrequently: true });
let prevGray = null, lastMotionAt = 0;
function motionCenter(video) {
  mctx.drawImage(video, 0, 0, MW, MH);
  const d = mctx.getImageData(0, 0, MW, MH).data;
  const gray = new Uint8Array(MW * MH);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) gray[j] = (d[i] * 3 + d[i + 1] * 4 + d[i + 2]) >> 3;
  let sx = 0, n = 0;
  if (prevGray) {
    for (let j = 0; j < gray.length; j++) {
      if (Math.abs(gray[j] - prevGray[j]) > 30) { sx += j % MW; n++; }
    }
  }
  prevGray = gray;
  // mind. 2 % und höchstens 40 % des Bildes bewegt (sonst z. B. Licht- oder Kamerawackeln)
  return n > MW * MH * 0.02 && n < MW * MH * 0.4 ? sx / n / MW : null;
}

async function startCamera() {
  const video = $('cam');
  try {
    setCam('startet …');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    $('mirror').classList.add('on');
    // Bewegungserkennung läuft sofort; die Handerkennung kommt dazu, sobald sie geladen ist
    const cam = { recognizer: null };
    camLoop(cam, video);
    setCam('lädt Handerkennung …');
    loadRecognizer()
      .then((r) => { cam.recognizer = r; setCam('bereit ✅'); })
      .catch(() => setCam('Handerkennung lädt nicht (Internet?) – nur Bewegung'));
  } catch (e) {
    const names = { NotAllowedError: 'Kamera nicht erlaubt', NotReadableError: 'Kamera belegt', NotFoundError: 'keine Kamera' };
    setCam('Fehler: ' + (names[e && e.name] || (e && (e.message || e.name)) || e));
  }
}

function camLoop(cam, video) {
  const canvas = $('camCanvas'), g = canvas.getContext('2d');
  let lastVideoTime = -1, lastProc = 0;
  const step = () => {
    const now = performance.now();
    // höchstens 20 Bilder pro Sekunde auswerten (schont den Akku)
    if (video.readyState >= 2 && video.currentTime !== lastVideoTime && now - lastProc >= 50) {
      lastVideoTime = video.currentTime;
      lastProc = now;
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
      let res = null;
      if (cam.recognizer) { try { res = cam.recognizer.recognizeForVideo(video, now); } catch (e) {} }
      g.clearRect(0, 0, canvas.width, canvas.height);
      const lm = res && res.landmarks && res.landmarks[0];
      const mx = motionCenter(video);
      if (lm) {
        const tip = lm[12]; // Spitze des Mittelfingers
        g.fillStyle = '#facc15';
        g.beginPath(); g.arc(tip.x * canvas.width, tip.y * canvas.height, 14, 0, Math.PI * 2); g.fill();
        if (cam.recognizer) setCam('Hand ✋');
        motionWave.reset();
        if (wave.add(tip.x, now)) waveBack('Winken (Hand)');
      } else {
        wave.reset();
        if (mx !== null) {
          lastMotionAt = now;
          // Bewegungs-Schwerpunkt als blauer Punkt im Kamerabild
          g.fillStyle = '#3b82f6';
          g.beginPath(); g.arc(mx * canvas.width, canvas.height / 2, 10, 0, Math.PI * 2); g.fill();
          if (motionWave.add(mx, now)) waveBack('Winken (Bewegung)');
        } else if (now - lastMotionAt > 600) {
          motionWave.reset();
        }
        if (cam.recognizer) setCam(mx !== null ? 'keine Hand · Bewegung' : 'keine Hand');
      }
    }
    requestAnimationFrame(step);
  };
  step();
}

// nur für Tests im Browser
window.zsDebug = { spots: () => mudSpots.map((m) => svgToScreen(m.x, m.y)), phase: () => state.phase, dirty: () => !!state.dirty, waveBack, wave, motionWave, sounds: () => Object.keys(soundBuf), say: (t) => handleHeard([t], true), current: () => state.current && state.current.name };

/* ======================= Kindgerecht ======================= */
// Bildschirm bleibt an, solange gespielt wird
let wakeLock = null;
async function keepScreenOn() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.phase !== 'start') keepScreenOn();
});

// Zurück-Taste/-Geste verlässt das Spiel nicht versehentlich
function guardBackButton() {
  history.pushState({ zs: 1 }, '');
  window.addEventListener('popstate', () => history.pushState({ zs: 1 }, ''));
}

// Elternecke: 1,5 Sekunden oben links drücken schaltet die Testanzeigen ein/aus
let testMode = false;
try { testMode = localStorage.getItem('zs-test') === '1'; } catch (e) {}
document.body.classList.toggle('testmode', testMode);
let toastTimer = 0, parentTimer = 0;
function toast(text) {
  $('toast').textContent = text;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
}
$('parent').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  clearTimeout(parentTimer);
  parentTimer = setTimeout(() => {
    testMode = !testMode;
    document.body.classList.toggle('testmode', testMode);
    try { localStorage.setItem('zs-test', testMode ? '1' : '0'); } catch (e) {}
    toast(testMode ? 'Testanzeige an' : 'Testanzeige aus');
  }, 1500);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => $('parent').addEventListener(ev, () => clearTimeout(parentTimer)));
document.addEventListener('contextmenu', (e) => e.preventDefault());

/* ======================= Wetter ======================= */
// Wolke antippen: sie wird grau und es regnet ein paar Sekunden (mud = true: braune Matschtropfen)
function rain(cloud, mud = false) {
  const cls = mud ? 'muddy' : 'rain';
  if (cloud.classList.contains(cls)) return;
  cloud.classList.add(cls);
  const stage = $('stage');
  const sr = stage.getBoundingClientRect();
  const cr = cloud.getBoundingClientRect();
  const DURATION = mud ? 2000 : 3500;
  const start = performance.now();
  const spawn = () => {
    if (performance.now() - start > DURATION) {
      setTimeout(() => cloud.classList.remove(cls), 900);
      return;
    }
    for (let k = 0; k < (mud ? 1 : 2); k++) {
      const d = document.createElement('div');
      d.className = mud ? 'drop mud' : 'drop';
      const x = cr.left - sr.left + 6 + Math.random() * (cr.width - 12);
      const y0 = cr.bottom - sr.top - 4;
      const y1 = sr.height * (0.64 + Math.random() * 0.22); // landet auf der Wiese
      d.style.left = x + 'px';
      d.style.top = y0 + 'px';
      stage.insertBefore(d, animalEl); // hinter dem Tier
      const fall = d.animate(
        [{ transform: 'translateY(0)', opacity: 0.95 }, { transform: `translateY(${y1 - y0}px)`, opacity: 0.7 }],
        { duration: 650 + Math.random() * 350, easing: 'ease-in' }
      );
      fall.onfinish = () => d.remove();
    }
    setTimeout(spawn, mud ? 110 : 60);
  };
  spawn();
}

/* ---------- Matsch ----------
   Die kleine Wolke (rechts) ist die Matschwolke: Sie zieht über das wartende Tier,
   wird braun und lässt Matschflecken auf das Tier fallen. Das Kind reibt sie mit dem Finger weg. */
const SVGNS = 'http://www.w3.org/2000/svg';
// mögliche Fleckstellen (Zeichnungs-Koordinaten, passen zu allen Tieren: Kopf und Bauch)
const MUD_SPOTS = [[170, 112], [210, 118], [190, 98], [165, 196], [215, 192], [190, 222], [152, 232], [228, 230], [178, 160], [204, 165]];
let mudSpots = [];

function svgToScreen(x, y) {
  const svg = bodyEl.querySelector('svg');
  const ctm = svg && svg.getScreenCTM();
  if (!ctm) return null;
  const p = new DOMPoint(x, y).matrixTransform(ctm);
  return { x: p.x, y: p.y };
}

function addMudSpot(x, y) {
  const svg = bodyEl.querySelector('svg');
  if (!svg) return;
  const g = document.createElementNS(SVGNS, 'g');
  const r = 9 + Math.random() * 5;
  // unregelmäßiger Klecks aus mehreren Kreisen
  [[0, 0, r], [r * 0.7, -r * 0.3, r * 0.6], [-r * 0.6, r * 0.4, r * 0.55], [r * 0.2, r * 0.8, r * 0.4], [-r * 1.3, -r * 0.6, r * 0.25]].forEach(([dx, dy, rr]) => {
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', x + dx); c.setAttribute('cy', y + dy); c.setAttribute('r', rr);
    c.setAttribute('fill', '#7a5230');
    g.appendChild(c);
  });
  g.setAttribute('opacity', '0.92');
  g.style.transformBox = 'fill-box'; g.style.transformOrigin = '50% 50%';
  svg.appendChild(g);
  g.animate([{ transform: 'scale(.3)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 300, easing: 'ease-out' });
  mudSpots.push({ x, y, el: g, dirt: 1 });
}

function splashOnAnimal(cloud) {
  const stage = $('stage');
  const sr = stage.getBoundingClientRect();
  const cr = cloud.getBoundingClientRect();
  const free = MUD_SPOTS.filter(([x, y]) => !mudSpots.some((s) => Math.hypot(s.x - x, s.y - y) < 10));
  const chosen = free.sort(() => Math.random() - 0.5).slice(0, 6);
  chosen.forEach(([sx, sy], i) => {
    setTimeout(() => {
      const jx = sx + (Math.random() * 10 - 5), jy = sy + (Math.random() * 10 - 5);
      const target = svgToScreen(jx, jy);
      if (!target) return;
      const d = document.createElement('div');
      d.className = 'drop mud';
      const x0 = cr.left - sr.left + cr.width * (0.3 + Math.random() * 0.4);
      const y0 = cr.bottom - sr.top - 4;
      d.style.left = x0 + 'px'; d.style.top = y0 + 'px'; d.style.zIndex = 3;
      stage.appendChild(d); // vor dem Tier
      const dx = target.x - sr.left - x0 - 5, dy = target.y - sr.top - y0 - 6;
      d.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${dx}px, ${dy}px)` }],
        { duration: 550, easing: 'ease-in' }).onfinish = () => { d.remove(); addMudSpot(jx, jy); };
    }, i * 220);
  });
  return chosen.length * 220 + 600;
}

async function mudCloud(cloud) {
  if (cloud.classList.contains('muddy') || cloud.dataset.busy) return;
  // Tier wartet gerade nicht: Matsch fällt nur auf die Wiese
  if (state.phase !== 'waiting') { rain(cloud, true); return; }
  cloud.dataset.busy = '1';
  state.phase = 'mudding';
  dbgLast = 'Matschwolke'; renderDebug();
  // Wolke zieht über den Kopf des Tiers
  const cr = cloud.getBoundingClientRect();
  const ar = bodyEl.getBoundingClientRect();
  const dx = (ar.left + ar.width / 2) - (cr.left + cr.width / 2);
  const dy = Math.max(0, (ar.top - 4) - cr.bottom); // knapp über dem Kopf
  const go = cloud.animate([{ translate: '0 0' }, { translate: `${dx}px ${dy}px` }], { duration: 900, easing: 'ease-in-out', fill: 'forwards' });
  await go.finished.catch(() => {});
  cloud.classList.add('muddy');
  await wait(splashOnAnimal(cloud));
  state.dirty = mudSpots.length > 0;
  cloud.classList.remove('muddy');
  const back = cloud.animate([{ translate: `${dx}px ${dy}px` }, { translate: '0 0' }], { duration: 900, easing: 'ease-in-out', fill: 'forwards' });
  go.cancel();
  state.phase = 'waiting';
  state.lastActivity = Date.now();
  setMode('waiting');
  setTimeout(spongeHint, 400);
  await back.finished.catch(() => {});
  back.cancel();
  delete cloud.dataset.busy;
}

// Reiben: Flecken in der Nähe des Fingers werden blasser und verschwinden
function rub(e) {
  const svg = bodyEl.querySelector('svg');
  const ctm = svg && svg.getScreenCTM();
  if (!ctm) return;
  const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse());
  const moved = lastRub ? Math.hypot(p.x - lastRub.x, p.y - lastRub.y) : 4;
  lastRub = p;
  state.lastActivity = Date.now();
  lastRubAt = Date.now();
  for (const s of mudSpots) {
    if (Math.hypot(p.x - s.x, p.y - s.y) < 28) {
      s.dirt -= Math.min(moved, 15) * 0.025;
      s.el.setAttribute('opacity', String(Math.max(0, s.dirt) * 0.92));
      if (s.dirt <= 0.05) { s.el.remove(); s.done = true; sparkle(e.clientX, e.clientY, 1); }
    }
  }
  mudSpots = mudSpots.filter((s) => !s.done);
  if (state.dirty && !mudSpots.length) { state.dirty = false; rubbing = false; celebrate(); }
}

// Glitzer an einer Bildschirmstelle
function sparkle(cx, cy, count = 8) {
  const stage = $('stage');
  const sr = stage.getBoundingClientRect();
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = '✨';
    s.style.left = (cx - sr.left - 15) + 'px';
    s.style.top = (cy - sr.top - 15) + 'px';
    stage.appendChild(s);
    const ang = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 70;
    s.animate([{ transform: 'translate(0,0) scale(.5)', opacity: 1 },
               { transform: `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist - 30}px) scale(1.1)`, opacity: 0 }],
      { duration: 900 + Math.random() * 400, easing: 'ease-out' }).onfinish = () => s.remove();
  }
}

// Schwamm-Hinweis: Solange das Tier schmutzig ist, wischt ein Schwamm über einen Fleck,
// damit man sieht, dass geputzt werden muss. Kommt sofort und dann alle 3,5 s (nicht während das Kind reibt).
let lastRubAt = 0, lastSpongeAt = 0;
function spongeHint() {
  if (!state.dirty || state.phase !== 'waiting' || !mudSpots.length) return;
  lastSpongeAt = Date.now();
  const spot = mudSpots[Math.floor(Math.random() * mudSpots.length)];
  const pos = svgToScreen(spot.x, spot.y);
  if (!pos) return;
  const sr = $('stage').getBoundingClientRect();
  const sp = document.createElement('div');
  sp.className = 'sponge';
  sp.textContent = '🧽';
  sp.style.left = (pos.x - sr.left - 23) + 'px';
  sp.style.top = (pos.y - sr.top - 23) + 'px';
  $('stage').appendChild(sp);
  sp.animate([
    { transform: 'translateX(0) rotate(0)', opacity: 0 },
    { transform: 'translateX(-22px) rotate(-12deg)', opacity: 1, offset: 0.15 },
    { transform: 'translateX(22px) rotate(12deg)', offset: 0.35 },
    { transform: 'translateX(-22px) rotate(-12deg)', offset: 0.55 },
    { transform: 'translateX(22px) rotate(12deg)', opacity: 1, offset: 0.8 },
    { transform: 'translateX(0) rotate(0)', opacity: 0 }
  ], { duration: 1800, easing: 'ease-in-out' }).onfinish = () => sp.remove();
}
setInterval(() => {
  const now = Date.now();
  if (state.dirty && state.phase === 'waiting' && now - lastSpongeAt > 3500 && now - lastRubAt > 2500) spongeHint();
}, 500);

// Sauber! Tier freut sich, läuft einmal im Kreis, setzt sich wieder hin und winkt
async function celebrate() {
  state.phase = 'celebrating';
  dbgLast = 'sauber gerieben'; renderDebug();
  const ar = bodyEl.getBoundingClientRect();
  sparkle(ar.left + ar.width / 2, ar.top + ar.height * 0.45, 12);
  setMode('happy');
  showBubble(state.current.say);
  await Promise.all([playSound(state.current), wait(1500)]);
  hideBubble();
  setMode('walking');
  const lap = animalEl.animate([
    { left: '50%', bottom: '12%', scale: 1 },
    { left: '74%', bottom: '15%', scale: 0.9 },
    { left: '50%', bottom: '19%', scale: 0.8 },
    { left: '26%', bottom: '15%', scale: 0.9 },
    { left: '50%', bottom: '12%', scale: 1 }
  ], { duration: 2600, easing: 'linear' });
  await lap.finished.catch(() => {});
  setMode('waiting');
  await wait(350);
  setMode('waveback');
  await wait(2000);
  setMode('waiting');
  state.phase = 'waiting';
  state.lastActivity = Date.now();
}

const clouds = document.querySelectorAll('.cloud');
clouds[0].addEventListener('pointerdown', (e) => { e.preventDefault(); rain(clouds[0]); });    // Regenwolke
clouds[1].addEventListener('pointerdown', (e) => { e.preventDefault(); mudCloud(clouds[1]); }); // Matschwolke

// Sonne antippen: sie wird größer, leuchtet und strahlt ein paar Sekunden
let sunTimer = 0;
$('sun').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  $('sun').classList.add('shine');
  $('stage').classList.add('sunny');
  clearTimeout(sunTimer);
  sunTimer = setTimeout(() => { $('sun').classList.remove('shine'); $('stage').classList.remove('sunny'); }, 4000);
});

// Offline-Fähigkeit und App-Installation
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ======================= Start ======================= */
$('startBtn').addEventListener('click', () => {
  // Vollbild (muss direkt beim Tippen passieren)
  const el = document.documentElement;
  try { const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' }); if (r && r.catch) r.catch(() => {}); } catch (e) {}
  keepScreenOn();
  guardBackButton();
  // Ton und Sprachausgabe müssen durch eine Berührung freigeschaltet werden
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) { audioCtx = new AC(); audioCtx.resume(); decodeSounds().then(releaseAudio); }
  if ('speechSynthesis' in window) {
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
  }
  $('start').remove();
  setSr('startet …');
  prepareLocalSpeech();
  listener.init();
  startCamera();
  nextAnimal();
});

renderDebug();
